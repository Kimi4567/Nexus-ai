<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .text-gradient { background: linear-gradient(to right, #38bdf8, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="fixed top-0 left-0 right-0 z-50 glass">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
            <div class="flex items-center space-x-2">
                <span class="text-xl font-bold text-gradient">NEXUS AI</span>
            </div>
            <div class="flex space-x-4">
                <a href="#" class="text-gray-300">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="pt-20 p-6">
        <h1 class="text-3xl font-bold mb-4">Create New Video</h1>
        <div class="glass rounded-2xl p-8 mb-8">
            <textarea id="videoPrompt" placeholder="Enter your video description..." class="w-full h-32 bg-gray-800 border border-gray-600 rounded-xl p-4 text-white mb-4"></textarea>
            <button onclick="generateVideo(this)" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl">Generate Video</button>
        </div>
        <div id="videoResult" class="hidden glass rounded-2xl p-8 text-center">
            <h3 class="text-xl font-semibold mb-2">Video Generated!</h3>
            <p id="resultMessage" class="hidden text-sm text-slate-300 mb-4"></p>
            <video id="videoPreview" class="hidden mx-auto rounded-xl w-full max-w-3xl mb-4" controls playsinline muted></video>
            <div class="flex justify-center gap-4">
                <button id="downloadButton" type="button" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl">Download Video</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
